<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar Smart Irrigation Dashboard</title>
  <!-- Chart.js and Firebase App SDKs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-yellow: #facc15;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 18px;
      border: 1px solid #334155;
    }
    .card h3 {
      margin: 0;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .card .value {
      font-size: 1.8rem;
      font-weight: 700;
      margin: 8px 0 0 0;
    }
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
      gap: 20px;
    }
    .chart-container {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #334155;
      position: relative;
    }
    .chart-container h2 {
      margin-top: 0;
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🌱 Solar Smart Irrigation System</h1>
    <div id="connectionStatus" style="color: var(--accent-green); font-size: 0.9rem;">● Live Connected</div>
  </div>

  <!-- Real-time Stat Cards -->
  <div class="grid-cards">
    <div class="card">
      <h3>Solar Generation</h3>
      <div class="value" id="valSolar">0.00 W</div>
    </div>
    <div class="card">
      <h3>Battery Status</h3>
      <div class="value" id="valBattery">0.00 V (0%)</div>
    </div>
    <div class="card">
      <h3>Soil Moisture</h3>
      <div class="value" id="valSoil">0 %</div>
    </div>
    <div class="card">
      <h3>Cumulative Energy</h3>
      <div class="value" id="valEnergy">0.000 Wh</div>
    </div>
  </div>

  <!-- 3 Graphs Grid -->
  <div class="charts-grid">
    <!-- Chart 1: Energy vs Time -->
    <div class="chart-container">
      <h2>⚡ Pump Energy Consumption vs Time (Wh)</h2>
      <canvas id="energyChart"></canvas>
    </div>

    <!-- Chart 2: Solar Power vs Time -->
    <div class="chart-container">
      <h2>☀️ Solar Power Input vs Time (Watts)</h2>
      <canvas id="solarChart"></canvas>
    </div>

    <!-- Chart 3: Battery vs Time -->
    <div class="chart-container" style="grid-column: span 1 / -1;">
      <h2>🔋 Battery Voltage vs Time (Volts)</h2>
      <canvas id="batteryChart"></canvas>
    </div>
  </div>

  <script>
    // 1. Firebase Initialization
    const firebaseConfig = {
      databaseURL: "https://solar-irrigation-system-f95ea-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. Chart.js Common Config
    const maxDataPoints = 30;
    const chartOptions = {
      responsive: true,
      animation: false,
      scales: {
        x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
        y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
      },
      plugins: { legend: { labels: { color: '#f8fafc' } } }
    };

    // Chart 1: Energy Consumption
    const ctxEnergy = document.getElementById('energyChart').getContext('2d');
    const energyChart = new Chart(ctxEnergy, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Energy (Watt-hours)',
          data: [],
          borderColor: '#4ade80',
          backgroundColor: 'rgba(74, 222, 128, 0.1)',
          fill: true,
          tension: 0.3
        }]
      },
      options: chartOptions
    });

    // Chart 2: Solar Power
    const ctxSolar = document.getElementById('solarChart').getContext('2d');
    const solarChart = new Chart(ctxSolar, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Solar Power (W)',
          data: [],
          borderColor: '#facc15',
          backgroundColor: 'rgba(250, 204, 21, 0.1)',
          fill: true,
          tension: 0.3
        }]
      },
      options: chartOptions
    });

    // Chart 3: Battery Voltage
    const ctxBattery = document.getElementById('batteryChart').getContext('2d');
    const batteryChart = new Chart(ctxBattery, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Battery Voltage (V)',
          data: [],
          borderColor: '#38bdf8',
          backgroundColor: 'rgba(56, 189, 248, 0.1)',
          fill: true,
          tension: 0.3
        }]
      },
      options: chartOptions
    });

    // Helper: Append data to chart with rolling window
    function addDataPoint(chart, label, value) {
      chart.data.labels.push(label);
      chart.data.datasets[0].data.push(value);
      if (chart.data.labels.length > maxDataPoints) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
      }
      chart.update();
    }

    // 3. Real-Time Telemetry Listener (Update Cards)
    db.ref('/telemetry').on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      document.getElementById('valSolar').innerText = `${data.solar_power_w?.toFixed(2) || '0.00'} W`;
      document.getElementById('valBattery').innerText = `${data.battery_voltage?.toFixed(2) || '0.00'} V (${data.battery_pct || 0}%)`;
      document.getElementById('valSoil').innerText = `${data.soil_moisture || 0} %`;
      document.getElementById('valEnergy').innerText = `${data.energy_consumption_wh?.toFixed(4) || '0.000'} Wh`;
    });

    // 4. Historical Stream Listener (Feed 3 Graphs)
    db.ref('/history').limitToLast(maxDataPoints).on('child_added', (snapshot) => {
      const point = snapshot.val();
      if (!point) return;

      const timeLabel = point.time || new Date().toLocaleTimeString();
      addDataPoint(energyChart, timeLabel, point.energy_wh || 0);
      addDataPoint(solarChart, timeLabel, point.solar_power || 0);
      addDataPoint(batteryChart, timeLabel, point.battery_voltage || 0);
    });
  </script>
</body>
</html>
